name: Demo Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Demo platform"
        required: true
        default: both
        type: choice
        options:
          - macOS
          - iOS
          - both
      configuration:
        description: "Build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
          - both

permissions:
  contents: write

concurrency:
  group: mycli-demo-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Demo
    runs-on: macos-26

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Demo project
        working-directory: Demo
        run: xcodegen generate

      - name: Build and publish selected Demo releases
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
          SELECTED_CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PACKAGES="$RUNNER_TEMP/EpubKit-SourcePackages"
          BASE_TAG="mycli-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if [[ "$SELECTED_CONFIGURATION" == "both" ]]; then
            CONFIGURATIONS=("Debug" "Release")
          else
            CONFIGURATIONS=("$SELECTED_CONFIGURATION")
          fi

          build_macos() {
            local configuration="$1"
            local tag="$2"
            local lower
            lower="$(echo "$configuration" | tr '[:upper:]' '[:lower:]')"
            local derived="$RUNNER_TEMP/EpubKit-macOS-$configuration"
            local artifacts="$GITHUB_WORKSPACE/artifacts-$lower"
            mkdir -p "$artifacts"

            xcodebuild \
              -project Demo/EpubKitDemo.xcodeproj \
              -scheme EpubKitDemo \
              -configuration "$configuration" \
              -sdk macosx \
              -destination "platform=macOS" \
              -derivedDataPath "$derived" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build

            local app="$derived/Build/Products/$configuration/EpubKitDemo.app"
            test -d "$app"

            local executable
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            local archs_found
            archs_found="$(lipo -archs "$app/Contents/MacOS/$executable")"
            [[ " $archs_found " == *" arm64 "* ]]
            [[ " $archs_found " == *" x86_64 "* ]]

            ditto -c -k --sequesterRsrc --keepParent \
              "$app" \
              "$artifacts/EpubKitDemo-macOS-universal-unsigned-$tag.zip"
          }

          build_ios() {
            local configuration="$1"
            local tag="$2"
            local lower
            lower="$(echo "$configuration" | tr '[:upper:]' '[:lower:]')"
            local archive="$RUNNER_TEMP/EpubKit-iOS-$configuration.xcarchive"
            local artifacts="$GITHUB_WORKSPACE/artifacts-$lower"
            mkdir -p "$artifacts"

            xcodebuild archive \
              -project Demo/EpubKitDemo.xcodeproj \
              -scheme EpubKitDemo-iOS \
              -configuration "$configuration" \
              -destination "generic/platform=iOS" \
              -archivePath "$archive" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO

            test -d "$archive"
            ditto -c -k --sequesterRsrc --keepParent \
              "$archive" \
              "$artifacts/EpubKitDemo-iOS-unsigned-$tag.xcarchive.zip"
          }

          for configuration in "${CONFIGURATIONS[@]}"; do
            lower="$(echo "$configuration" | tr '[:upper:]' '[:lower:]')"

            if [[ "$SELECTED_CONFIGURATION" == "both" ]]; then
              tag="$BASE_TAG-$lower"
            else
              tag="$BASE_TAG"
            fi

            rm -rf "artifacts-$lower"

            if [[ "$SELECTED_PLATFORM" == "macOS" || "$SELECTED_PLATFORM" == "both" ]]; then
              build_macos "$configuration" "$tag"
            fi

            if [[ "$SELECTED_PLATFORM" == "iOS" || "$SELECTED_PLATFORM" == "both" ]]; then
              build_ios "$configuration" "$tag"
            fi

            for archive in "artifacts-$lower"/*; do
              test -f "$archive"
              bytes="$(stat -f%z "$archive")"
              if (( bytes >= 2147483648 )); then
                echo "error: $archive is too large for a GitHub Release asset" >&2
                exit 1
              fi
            done

            gh release create "$tag" "artifacts-$lower"/* \
              --target "$RELEASE_SHA" \
              --title "$tag" \
              --prerelease \
              --generate-notes
          done
