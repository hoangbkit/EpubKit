name: CI

on:
  push:
    branches:
      - master
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [
          macos-15
        ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM dependencies and build products
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ matrix.runner }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ matrix.runner }}-

      - name: Run tests
        run: swift test

  notify:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: tsickert/discord-webhook@v6
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: "${{ needs.test.result == 'success' && '✅' || needs.test.result == 'cancelled' && '⚠️' || '❌' }} **CI ${{ needs.test.result == 'success' && 'Passed' || needs.test.result == 'cancelled' && 'Cancelled' || 'Failed' }}** - ${{ github.repository }}@${{ github.ref_name }}\nCommit: ${{ github.sha }}\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
