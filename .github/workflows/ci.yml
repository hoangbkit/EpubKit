name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [
          macos-15,
          macos-15-intel,
          macos-26
        ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM dependencies and build products
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ matrix.runner }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ matrix.runner }}-

      - name: Run tests
        run: swift test

      - name: Verify runner architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          case "$(uname -m)" in
            arm64|x86_64) ;;
            *) echo "Unexpected architecture"; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate demo Xcode project
        working-directory: Demo
        run: xcodegen generate

      - name: Build demo app
        run: |
          xcodebuild \
            -project Demo/EpubKitDemo.xcodeproj \
            -scheme EpubKitDemo \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData/EpubKitDemo \
            CODE_SIGNING_ALLOWED=NO \
            build

  notify:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Send Discord notification
        env:
          STATUS: ${{ needs.test.result }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; TEXT="Passed"
          elif [ "$STATUS" = "cancelled" ]; then EMOJI="⚠️"; TEXT="Cancelled"
          else EMOJI="❌"; TEXT="Failed"
          fi
          MSG=$(git log --format=%s -1)
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"${EMOJI} **CI ${TEXT}**\n\`$(echo $SHA | cut -c1-7)\` ${MSG}\nBranch: ${BRANCH}\nRun: ${RUN_URL}\"}" \
            "$WEBHOOK"
