name: EpubKitDemo

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"

packages:
  EpubKit:
    path: ../..

targets:
  EpubKitDemo:
    type: application
    platform: macOS
    sources:
      - path: EpubKitDemo
        excludes:
          - Info.plist
          - EpubKitDemo.entitlements
    dependencies:
      - package: EpubKit
        product: EpubKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.byby.EpubKitDemo
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: EpubKitDemo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: EpubKitDemo/EpubKitDemo.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  EpubKitDemo:
    build:
      targets:
        EpubKitDemo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
